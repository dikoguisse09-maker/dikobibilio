<nav style="background:#fff; border-bottom:1px solid #e5e5e5; padding:0 1.5rem; height:60px; display:flex; align-items:center; justify-content:space-between;">

  {% load static %}
  
  {# Logo #}
  <a href="{% url 'index' %}" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:#1a1a1a; font-weight:600; font-size:16px;">
    📚 Bibliothèque
  </a>

  {# Liens centraux #}
{# Liens centraux #}
  <div style="display:flex; align-items:center; gap:4px;">
    <a href="{% url 'index' %}" style="padding:6px 12px; border-radius:8px; font-size:14px; color:#555; text-decoration:none;">
      Accueil
    </a>
    <a href="{% url 'ajouter_auteur' %}" style="padding:6px 12px; border-radius:8px; font-size:14px; color:#555; text-decoration:none;">
      Ajouter un auteur
    </a>
    <a href="{% url 'ajouter_livre' %}" style="padding:6px 12px; border-radius:8px; font-size:14px; color:#555; text-decoration:none;">
      Ajouter un livre
    </a>
  </div>

  {# Droite - utilisateur #}
  <div style="display:flex; align-items:center; gap:12px;">
    {% if user.is_authenticated %}
      <div style="display:flex; align-items:center; gap:8px;">
        <div style="width:32px; height:32px; border-radius:50%; background:#EEEDFE; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:500; color:#3C3489;">
          {{ user.username|slice:":1"|upper }}
        </div>
        <span style="font-size:14px; color:#444;">{{ user.username }}</span>
      </div>
      <form method="post" action="{% url 'deconnexion' %}">
        {% csrf_token %}
        <button type="submit" style="padding:6px 14px; border-radius:8px; border:1px solid #fca5a5; background:#fff; color:#dc2626; font-size:13px; cursor:pointer;">
          Déconnexion
        </button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" style="padding:6px 14px; border-radius:8px; border:1px solid #ddd; background:#fff; color:#333; font-size:13px; text-decoration:none;">
        Connexion
      </a>
    {% endif %}
  </div>

</nav>
